# Blueprint Render di Presenza: l'API (be-node), il render delle card (be-render) e l'app web statica.
#
# Render → New → Blueprint → questo repo. I segreti (sync: false) li chiede una volta alla
# creazione: si copiano da be-node/.env. A ogni sync il Blueprint riscrive le variabili con
# `value:`, quindi gli indirizzi si correggono qui e non nel pannello.
# Passi e limiti in be-node/README.md, «Deploy su Render».
services:
  # --- API: Fastify, Supabase, Agent SDK ---------------------------------------
  # Si costruisce dalla radice del repo: il bundle include src/domain e src/lib dell'app.
  # Piano free per ora: si addormenta dopo 15 minuti senza richieste e ha 512 MB, stretti
  # per il processo di Claude Code che ogni generazione AI avvia.
  - type: web
    name: presenza-api
    runtime: node
    plan: free
    region: frankfurt
    branch: master
    # Con NODE_ENV=production npm salterebbe le dipendenze di sviluppo, e la build usa esbuild.
    buildCommand: cd be-node && npm ci --include=dev && npm run build
    startCommand: node be-node/dist/server.mjs
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    # Riparte solo quando cambia qualcosa che finisce nel bundle.
    buildFilter:
      paths:
        - be-node/**
        - src/domain/**
        - src/lib/**
        - src/services/mock/**
        - src/services/types.ts
        - src/design-system/tokens.ts
        - render.yaml
      ignoredPaths:
        - be-node/test/**
        - be-node/README.md
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: APP_TIME_ZONE
        value: Europe/Rome
      # DeepSeek diretta (server in Cina); con un Claude, `claude-opus-5`. Vedi be-node/src/ai/providers.ts.
      - key: AI_MODEL
        value: deepseek-flash
      # L'app web qui sotto. Se Render le assegna un altro sottodominio, va corretto qui.
      - key: CORS_ORIGINS
        value: https://presenza-app.onrender.com
      # Il progetto Supabase di sviluppo, condiviso con Velia: schema `presenza`.
      - key: SUPABASE_URL
        value: https://hcxiloivukbdcfcugksg.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      # Ruolo presenza_app dal pooler in modalità sessione (porta 5432).
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Per i modelli deepseek-*. Render chiede i `sync: false` solo alla creazione del Blueprint:
      # su quello già creato va aggiunta dal pannello del servizio.
      - key: DEEPSEEK_API_KEY
        sync: false
      # Visivi (docs/piano-visivi.md): foto con Gemini, scontorno con fal. Le chiavi si inseriscono dal pannello.
      - key: IMAGE_MODEL
        value: gemini-3.1-flash-image
      - key: GEMINI_API_KEY
        sync: false
      - key: FAL_KEY
        sync: false
      # Il servizio che compone i PNG (presenza-render, qui sotto). È un web service gratuito, e i servizi
      # gratuiti non ricevono dalla rete privata: l'API lo chiama dall'indirizzo pubblico, protetto dal
      # token, che arriva da lui. Se Render assegna un altro sottodominio, va corretto qui.
      - key: RENDER_URL
        value: https://presenza-render.onrender.com
      - key: RENDER_TOKEN
        fromService:
          type: web
          name: presenza-render
          envVarKey: RENDER_TOKEN
      # Il piano gratuito si addormenta: il primo PNG dopo una pausa aspetta che il servizio riparta.
      - key: RENDER_TIMEOUT_MS
        value: "180000"

  # --- Render delle card: Remotion + Chromium (be-render) ----------------------
  # Docker dalla radice del repo, perché il sito Remotion include src/templates e src/domain dell'app.
  # Per ora sul piano gratuito: 512 MB, stretti per Chromium (quindi un solo processo e uno scatto alla
  # volta), e si addormenta dopo 15 minuti. Se un PNG non arriva il visivo resta pronto lo stesso.
  # Per l'uso vero: piano standard da 2 GB e licenza Remotion (docs/piano-visivi.md, «Decisioni aperte»).
  - type: web
    name: presenza-render
    runtime: docker
    plan: free
    region: frankfurt
    branch: master
    dockerfilePath: ./be-render/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - be-render/**
        - src/templates/**
        - src/domain/**
        - src/lib/**
        - src/design-system/tokens.ts
      ignoredPaths:
        - be-render/README.md
        - be-render/tools/**
    envVars:
      - key: RENDER_TOKEN
        generateValue: true
      - key: RENDER_LOW_MEMORY
        value: "1"

  # --- App web: export statico di Expo ------------------------------------------
  - type: web
    name: presenza-app
    runtime: static
    branch: master
    buildCommand: npm ci && npx expo export --platform web
    staticPublishPath: dist
    autoDeployTrigger: commit
    buildFilter:
      ignoredPaths:
        - be-node/**
        - be-render/**
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Finisce dentro il bundle al momento della build: se cambia, serve un nuovo deploy dell'app.
      # Il sottodominio lo assegna Render: `presenza-api` era già preso.
      - key: EXPO_PUBLIC_API_URL
        value: https://presenza-api-stjx.onrender.com/api
    # L'app è una SPA: ogni percorso serve index.html e il routing lo fa Expo Router.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
